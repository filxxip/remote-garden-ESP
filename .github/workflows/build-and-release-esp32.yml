name: Build and Release ESP32 Firmware

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: docker build -t esp32-builder -f .devcontainer/Dockerfile .devcontainer

      - name: Build, package and upload firmware
        run: |
          docker run --rm \
            -v $PWD:/workspace \
            -w /workspace \
            -e GH_TOKEN=${{ secrets.GITHUB_TOKEN }} \
            -e CI=true \
            -e GITHUB_ACTIONS=true \
            esp32-builder \
            bash -c "source /opt/esp/idf/export.sh && make upload VERSION=latest GITHUB_REPO=${{ github.repository }}"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: esp32-firmware-latest
          path: release/*.tar.gz
          retention-days: 30